<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI & Dev Search</title>
<link href="https://fonts.googleapis.com/css?family=Raleway:400,700" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  min-height: 100vh;
  background: #0f172a;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Raleway', sans-serif;
}
.box {
  width: 100%;
  max-width: 680px;
  padding: 48px 40px;
  text-align: center;
}
h1 {
  font-size: 36px;
  font-weight: 700;
  color: #f1f5f9;
  margin-bottom: 8px;
}
p {
  color: #94a3b8;
  margin-bottom: 40px;
  font-size: 15px;
}
.search-wrapper {
  display: inline-flex;
  align-items: center;
  border: 3px solid #ffffff;
  border-radius: 50px;
  overflow: hidden;
}
input[type="text"] {
  width: 0;
  padding: 14px 0;
  background: transparent;
  border: none;
  color: #f1f5f9;
  font-size: 16px;
  font-family: 'Raleway', sans-serif;
  transition: width 0.8s cubic-bezier(0.68,-0.55,0.27,1.55),
              padding 0.8s;
  outline: none;
}
input[type="text"]:focus,
input[type="text"]:not(:placeholder-shown) {
  width: 320px;
  padding: 14px 20px;
}
button {
  background: transparent;
  border: none;
  padding: 14px 18px;
  cursor: pointer;
  color: white;
  font-size: 22px;
}
button:hover { color: #6366f1; }
</style>
</head>
<body>
<div class="box">
  <h1>AI & Dev Search</h1>
  <p>Search across GitHub repositories and arXiv research papers.</p>
  <form action="/results" method="get">
    <div class="search-wrapper">
      <input type="text" name="q" placeholder=" " required />
      <input type="hidden" name="top_k" value="10" />
      <button type="submit">⌕</button>
    </div>
  </form>
</div>
</body>
</html>
